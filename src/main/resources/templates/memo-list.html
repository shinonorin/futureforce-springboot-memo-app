<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>メモ一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="app-title">メモ一覧</h1>
            <a th:href="@{/memos/new}" class="btn btn-primary">
                <i class="ri-add-circle-line"></i> 新規メモ
            </a>
        </div>
		<!--検索フォーム-->
		<form th:action="@{/memos/search}" method="get"> <!--検索キーワードの送信先、URLにキーワードをつけて送信-->
			<input type="text" name="keyword" th:value="${keyword}" placeholder="タイトル・本文を検索"><!--placeholder入力欄に薄く表示する文-->
			<button type="submit" class="btn btn-primary">検索</button>
		</form>
        <div class="notes-grid">
            <div class="note-card" th:each="memo : ${memos}">
				<div class="note-card-header">
					<h3 class="note-card-title" th:text="${memo.title}">タイトル</h3>
				    <!-- 優先度バッジ -->
				    <span th:if="${memo.priority != null}" class="note-badge" th:classappend="${memo.priority.name().toLowerCase()}" th:text="${memo.priority.name() == 'HIGH' ? '高' : (memo.priority.name() == 'MEDIUM' ? '中' : '低')}">
				    </span>
				</div>
                <div class="note-card-content">
                    <p class="note-card-text" th:text="${memo.content}">内容</p>
                </div>
                <div class="note-card-footer">
                    <p class="note-date" th:text="${#temporals.format(memo.createdAt, 'yyyy/MM/dd HH:mm')}">日付</p>
                    <div class="note-actions">
                        <a th:href="@{|/memos/detail/${memo.id}|}" class="btn btn-primary">詳細</a>
                        <a th:href="@{|/memos/delete/${memo.id}|}" class="btn btn-danger">
                            削除
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${memos.isEmpty()}" class="empty-state">
			<!--検索結果が０だった時もここ-->
            <p th:text="${keyword != null and !keyword.isBlank()} ? '検索結果がありません' : 'メモがありません'">メモがありません</p>
            <a th:href="@{/memos/new}" class="btn btn-primary">新しいメモを作成</a>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
</body>

</html>
